version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-reservas
    environment:
      MYSQL_DATABASE: reserva_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  app-reservas:
    build: .
    container_name: app-reservas-container
    ports:
      - "8082:8082"
    depends_on:
      - mysql-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/reserva_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root