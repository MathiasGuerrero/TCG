version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-reservas
    environment:
      MYSQL_DATABASE: reserva_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  app-reservas:
    build: .
    container_name: app-reservas-container
    ports:
      - "8082:8082"
    depends_on:
      - mysql-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/reserva_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root


  mysql-db-pedidos:
    image: mysql:8.0
    container_name: mysql-pedidos
    environment:
      MYSQL_DATABASE: pedido_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"

  app-pedidos:
    build: C:\Users\HP\Desktop\Duoc UC\Fullstack\microservicios\pedidos swagger 02\pedidos
    container_name: app-pedidos-container
    stdin_open: true
    tty: true
    ports:
      - "8083:8083"
    depends_on:
      - mysql-db-pedidos